[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lless"
version = "0.1.0"
description = "Auditable decision statistics with visible uncertainty"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "cryptography>=43", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["lifeev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
